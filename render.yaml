services:
  - type: web
    name: ai-room-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-room-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: FRONTEND_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        value: ""
      - key: GEMINI_API_KEY
        value: ""
      - key: ANTHROPIC_API_KEY
        value: ""
      - key: FIRECRAWL_API_KEY
        value: ""

databases:
  - name: ai-room-db
    region: singapore
    plan: free
    databaseName: airoom
    user: airoom_user
