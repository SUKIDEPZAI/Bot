services:
  - type: web
    name: chatgpt-codex-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CODEX_SINGLE_USER_MODE
        value: "false"
      - key: MAX_UPLOAD_MB
        value: "15"
      - key: DATABASE_URL
        fromDatabase:
          name: chatgpt-codex-db
          property: connectionString
databases:
  - name: chatgpt-codex-db
    plan: free
